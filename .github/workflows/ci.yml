# NEXUS CI — GitHub Actions on the free plan (2,000 min/month for private repos).
#
# Gate: lint + format + strict types + tests must all pass before merge. Security
# scanning (Trivy, gitleaks, Semgrep OSS) is free and runs on every push.
# No paid CI service, no paid scanner (D-019).

name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Nightly: catches free-tier/dependency drift, e.g. a transitive dep turning paid
    # or an OSS image being yanked.
    - cron: "20 3 * * *"

permissions:
  contents: read
  # gitleaks-action posts its findings as a PR comment. Without this the scan still runs but
  # the report is unreadable ("Resource not accessible by integration"), which is how a real
  # finding could go unnoticed. Scoped to pull-requests only: no write access to code, issues
  # or releases, and nothing here can push a commit.
  pull-requests: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  # Fail closed in CI too: no stage may enable live trading.
  NEXUS_LIVE_TRADING_ENABLED: "false"
  NEXUS_ENVIRONMENT: "DISABLED"
  NEXUS_AUDIT_BACKEND: "memory"
  DO_NOT_TRACK: "1"

jobs:
  # ---------------------------------------------------------------- secret scanning
  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks (full history)
        # No `with:` block on purpose. gitleaks-action@v2 accepts no inputs at all — passing
        # config-path produces "Unexpected input(s) 'config-path', valid inputs are ['']" and is
        # silently ignored. The gitleaks binary auto-discovers .gitleaks.toml at the repository
        # root, which is where the narrow allowlist lives.
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Pinned to the version the action would pick anyway, because .gitleaks.toml is written
          # against this exact release's config schema. 8.24.3 understands only a singular
          # [allowlist] table; a newer gitleaks added plural [[allowlists]]. Leaving the version
          # implicit would let the action's default move and silently change what this config
          # means — and an unrecognised key is ignored without an error, so the failure mode is a
          # scan that quietly stops honouring its own allowlist.
          GITLEAKS_VERSION: "8.24.3"

      - name: Trivy filesystem scan (config + secrets + licences)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,config,vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  # ---------------------------------------------------------------- python quality
  backend:
    name: Backend (lint · types · tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history, not the default depth of 1. test_repo_hygiene.py verifies that the one
          # commit excused from secret scanning in .gitleaks.toml actually exists, and that check
          # cannot run against a shallow clone — it failed on exactly that before this was set.
          # The repository is small (tens of commits), so this costs seconds.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Mypy (strict)
        run: mypy

      - name: Pytest
        run: pytest -q --maxfail=1

      - name: Assert live trading is impossible in this phase
        run: python -c "import nexus; g=nexus.PHASE_GATE; assert g['live_trading'] is False and g['venue_adapters'] is False and g['real_money_orders_possible'] is False and g['order_capability'] is False, g; print('phase gate verified:', g)"

      # Phase 3 added market-data adapters. They must stay public/read-only: no credential
      # parameter, no order verb. This is a structural check on the shipped code, so a future
      # edit that adds a trading capability to a data adapter fails the build.
      - name: Assert data adapters are credential-free and order-free
        run: |
          python - <<'EOF'
          import inspect
          from nexus.ingestion.bybit import BybitPublicAdapter
          from nexus.ingestion.okx import OkxPublicAdapter
          from nexus.ingestion.binance_vision import BinanceVisionHistorical
          from nexus.ingestion.dukascopy import DukascopyHistorical

          forbidden_params = {"api_key", "api_secret", "secret", "passphrase", "token", "password"}
          forbidden_verbs = ("place", "submit", "cancel", "withdraw", "transfer", "amend")

          for cls in (BybitPublicAdapter, OkxPublicAdapter, BinanceVisionHistorical, DukascopyHistorical):
              assert cls.requires_credentials is False, f"{cls.__name__} claims to need credentials"
              params = set(inspect.signature(cls.__init__).parameters)
              assert not (params & forbidden_params), f"{cls.__name__} takes a credential parameter"
              for name in dir(cls):
                  if name.startswith("_"):
                      continue
                  for verb in forbidden_verbs:
                      assert verb not in name.lower(), f"{cls.__name__}.{name} looks like a trading method"
              print(f"{cls.__name__}: read-only, credential-free")
          EOF

      - name: Assert no paid data vendor is referenced anywhere
        run: |
          ! grep -rEiq 'bloomberg|refinitiv|polygon\.io|databento|iqfeed|lseg|tiingo' backend/src \
            && echo "no paid data vendors in source"

      - name: Assert the API exposes no order endpoint
        run: |
          python - <<'EOF'
          from nexus.api.app import create_app
          from nexus.core.config import Settings
          import os
          os.environ["NEXUS_AUDIT_BACKEND"] = "memory"

          app = create_app(settings=Settings())
          paths = {r.path for r in app.routes}
          forbidden = ("order", "trade", "execute", "position", "withdraw")
          for path in paths:
              for verb in forbidden:
                  assert verb not in path.lower(), f"API exposes a trading route: {path}"
          print(f"{len(paths)} routes, none trading-capable:", sorted(paths))
          EOF

  # ---------------------------------------------------------------- ARM64 build check
  # The production host is Ampere A1 (ARM64). Verifying the image builds for arm64
  # prevents a x86-only surprise when deploying to the free tier.
  image:
    name: Container image (amd64 + arm64 build)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build multi-arch (no push — proves amd64 + arm64 cross-compilation)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: false
          load: false
          tags: nexus-core:ci-multiarch

      - name: Build amd64 and load it (the image Trivy can actually read)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64
          push: false
          load: true
          tags: nexus-core:ci

      # HIGH and CRITICAL both block, which is the posture this gate is supposed to have.
      #
      # It was split for a while — CRITICAL blocking, HIGH reported only — and that split was a
      # consequence of not being able to read the report, not a risk judgement: GitHub serves job
      # logs from results-receiver.actions.githubusercontent.com, which is outside this
      # environment's egress allowlist. A gate nobody can read is worse than no gate, because it
      # stays red and a permanently red build teaches everyone to ignore it. That was O-011.
      #
      # Two things closed it. The findings are now republished below as check annotations, which
      # the ordinary REST API exposes on any host — the same route that finally made the gitleaks
      # findings readable. And there was exactly one HIGH finding to triage: CVE-2025-47273,
      # setuptools 70.3.0 in the base image (arbitrary file write via PackageIndex.download,
      # fixed in 78.1.1), now upgraded in the Dockerfile. With the report readable and the
      # finding fixed, HIGH blocks again.
      - name: Trivy image scan (HIGH + CRITICAL block)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: nexus-core:ci
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: json
          output: trivy-findings.json

      - name: Publish findings as check annotations
        if: ${{ always() }}
        run: |
          # Turns the JSON report into annotations so the findings can be read without log
          # access, including on the runs where the scan above failed the job — which is exactly
          # when they matter.
          #
          # Everything is packed into ONE warning annotation. GitHub Actions allows at most 10
          # annotations per level per step, so a report that emitted one annotation per finding
          # would silently lose everything past the tenth — the cap would look like the answer.
          # The finding list inside the annotation is capped at 60 with truncation stated.
          python3 - <<'PY'
          import json, pathlib

          CAP = 60

          def annotation(level, title, lines):
              text = "\n".join(lines[:CAP + 2])
              esc = text.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              esc = esc.replace(":", "%3A").replace(",", "%2C")
              print(f"::{level} title={title}::{esc}")

          path = pathlib.Path("trivy-findings.json")
          if not path.is_file():
              annotation("warning", "trivy-image", ["no report produced - the scan step did not run"])
              raise SystemExit(0)

          report = json.loads(path.read_text() or "{}")
          findings = []
          for result in report.get("Results") or []:
              for vuln in result.get("Vulnerabilities") or []:
                  findings.append(
                      {
                          "pkg": vuln.get("PkgName", "?"),
                          "installed": vuln.get("InstalledVersion", "?"),
                          "fixed": vuln.get("FixedVersion") or "no-fix",
                          "id": vuln.get("VulnerabilityID", "?"),
                          "severity": vuln.get("Severity", "?"),
                          "target": result.get("Target", "?"),
                          "cls": result.get("Class", "?"),
                          # The file the scanner actually read. Without it, "setuptools 70.3.0"
                          # cannot be told apart from a vendored SBOM that merely declares that
                          # version — which is exactly the confusion defect 23 cost three attempts.
                          "path": vuln.get("PkgPath") or "-",
                      }
                  )

          if not findings:
              annotation(
                  "notice",
                  "trivy-image",
                  ["no HIGH or CRITICAL fixable vulnerabilities in nexus-core:ci"],
              )
              raise SystemExit(0)

          critical = sum(1 for f in findings if f["severity"] == "CRITICAL")
          body = [
              f"{len(findings)} findings ({critical} CRITICAL), each with an available fix. "
              "The scan fails the build until every one is fixed or explicitly justified."
          ]
          body += [
              "{severity} {id} {pkg} {installed} -> {fixed} [{cls}] in {target} @ {path}".format(**f)
              for f in findings[:CAP]
          ]
          if len(findings) > CAP:
              body.append(f"...and {len(findings) - CAP} more; see trivy-findings.json")
          by_pkg = {}
          for f in findings:
              by_pkg.setdefault(f["pkg"], []).append(f["id"])
          body.append("packages: " + ", ".join(f"{k}({len(v)})" for k, v in sorted(by_pkg.items())))
          annotation("warning", "trivy-image", body)
          PY

  # ---------------------------------------------------------------- compose sanity
  compose:
    name: Compose config valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          # Every `:?` (required) variable in docker-compose.yml must be supplied, or compose
          # aborts before validating anything. These are throwaway values for a config parse
          # only: no container is started and nothing here is a credential.
          POSTGRES_PASSWORD=ci-only \
            MINIO_ROOT_USER=ci-only MINIO_ROOT_PASSWORD=ci-only \
            GRAFANA_ADMIN_PASSWORD=ci-only \
            docker compose config --quiet
          echo "compose config valid"

      - name: Assert no paid images are referenced
        run: |
          ! grep -Eiq 'datadog|newrelic|dynatrace|splunk|snowflake|databricks' docker-compose.yml \
            && echo "no paid observability/data vendors in compose"
