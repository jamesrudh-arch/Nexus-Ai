# NEXUS CI — GitHub Actions on the free plan (2,000 min/month for private repos).
#
# Gate: lint + format + strict types + tests must all pass before merge. Security
# scanning (Trivy, gitleaks, Semgrep OSS) is free and runs on every push.
# No paid CI service, no paid scanner (D-019).

name: ci

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    # Nightly: catches free-tier/dependency drift, e.g. a transitive dep turning paid
    # or an OSS image being yanked.
    - cron: "20 3 * * *"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  # Fail closed in CI too: no stage may enable live trading.
  NEXUS_LIVE_TRADING_ENABLED: "false"
  NEXUS_ENVIRONMENT: "DISABLED"
  NEXUS_AUDIT_BACKEND: "memory"
  DO_NOT_TRACK: "1"

jobs:
  # ---------------------------------------------------------------- secret scanning
  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Trivy filesystem scan (config + secrets + licences)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret,config,vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  # ---------------------------------------------------------------- python quality
  backend:
    name: Backend (lint · types · tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check src tests

      - name: Ruff format check
        run: ruff format --check src tests

      - name: Mypy (strict)
        run: mypy

      - name: Pytest
        run: pytest -q --maxfail=1

      - name: Assert live trading is impossible in this phase
        run: python -c "import nexus; g=nexus.PHASE_GATE; assert g['live_trading'] is False and g['venue_adapters'] is False and g['real_money_orders_possible'] is False, g; print('phase gate verified:', g)"

  # ---------------------------------------------------------------- ARM64 build check
  # The production host is Ampere A1 (ARM64). Verifying the image builds for arm64
  # prevents a x86-only surprise when deploying to the free tier.
  image:
    name: Container image (amd64 + arm64 build)
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: false
          load: false
          tags: nexus-core:ci

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: nexus-core:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  # ---------------------------------------------------------------- compose sanity
  compose:
    name: Compose config valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml
        run: |
          POSTGRES_PASSWORD=ci-only MINIO_ROOT_PASSWORD=ci-only GRAFANA_ADMIN_PASSWORD=ci-only \
            docker compose config --quiet
          echo "compose config valid"

      - name: Assert no paid images are referenced
        run: |
          ! grep -Eiq 'datadog|newrelic|dynatrace|splunk|snowflake|databricks' docker-compose.yml \
            && echo "no paid observability/data vendors in compose"
