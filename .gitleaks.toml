# Gitleaks configuration — extends the default ruleset and allowlists three files by path.
#
# Why this file exists
# --------------------
# Three files in this repository have to contain strings that *look* like secrets, because
# recognising secret-shaped values is literally their job:
#
#   backend/src/nexus/secrets/redaction.py   the redactor: its regexes must spell out the shape
#                                            of a PEM block, an AWS key and a Slack token in
#                                            order to mask them
#   backend/src/nexus/audit/log.py           the audit gate: same patterns, applied before a
#                                            record is written to the hash chain
#   backend/tests/test_secrets_and_redaction.py
#                                            proves both work, so it must contain a value that
#                                            looks like a JWT and one that looks like a PEM
#
# Every one of those values is fabricated. The test JWT's signature is a run of the alphabet and
# its PEM body is four characters. Nothing here unlocks anything, and gitleaks flags all of it
# correctly — a scanner cannot know that a fixture is a fixture.
#
# This file deliberately contains NO secret-shaped literal of its own. An earlier version
# allowlisted the fixtures by regex, which meant copying the fake JWT and the fake PEM into this
# file — and gitleaks then flagged *this* file too, failing a build that had been green. An
# allowlist that reproduces what it is allowlisting defeats itself. Scope by path instead.
#
# Scope discipline
# ----------------
#   * extends the default ruleset rather than replacing or disabling it;
#   * bound to three named paths, all of which are detection code or its tests;
#   * names no `ruleIDs`, so no rule is switched off globally;
#   * has no top-level `[allowlist]`, which would suppress findings repo-wide.
#
# `backend/tests/test_repo_hygiene.py::TestSecretScanningIsNotWeakened` asserts all four
# properties plus the exact path set, so widening this file breaks the build rather than
# quietly reducing coverage.
#
# Residual risk, stated plainly: a genuine credential pasted into one of those three files would
# be missed by gitleaks. They are reviewed on every change precisely because of this, and the
# hygiene test's own regex sweep covers every *other* tracked file.

[extend]
useDefault = true

[[allowlists]]
description = """
Files whose purpose is to recognise or test recognition of secret-shaped values: the redactor,
the audit gate, and their tests. They must spell out what a PEM block, an AWS key or a JWT looks
like. Every matching value in them is fabricated and unlocks nothing. Scoped by path only — this
file intentionally contains no secret-shaped literal to allowlist by regex.
"""
paths = [
  '''backend/src/nexus/secrets/redaction\.py''',
  '''backend/src/nexus/audit/log\.py''',
  '''backend/tests/test_secrets_and_redaction\.py''',
]

[[allowlists]]
description = """
One commit, by SHA, for one mistake that is now fixed at HEAD.

Commit eb5234f added the first version of this file. That version allowlisted the fixtures by
regex, which meant copying a fabricated JWT and a fabricated PEM block into `.gitleaks.toml`
itself — and into `backend/tests/test_repo_hygiene.py`, which asserted those literals were still
present. Both files are outside the path allowlist above, so gitleaks flags that commit.

The literals were removed one commit later, in 1f7d17b, and `git grep` confirms HEAD carries
secret-shaped strings only inside the three allowlisted paths. Nothing in this entry is a real
credential: the JWT's signature is a run of the alphabet and the PEM body is four characters.

A `pull_request` run scans the whole branch history, which is why this is needed at all — a
`push` run scans only new commits and was already green. Scoping by commit SHA is the narrowest
available fix: it excuses one historical revision without reducing coverage of any file at HEAD,
and without rewriting published history.
"""
commits = ['eb5234f25a587da6b442785be8754a6954f0bdd4']
